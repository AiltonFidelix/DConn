name: cppcheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version

      - name: Run cppcheck
        run: |
          cppcheck \
            --platform=win64 \
            --enable=warning,performance,portability \
            --inconclusive \
            -i build \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --error-exitcode=1 \
            sources
